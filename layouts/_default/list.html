{{ define "main" }}
<nav class="crumbs">
  <a href="{{ "/" | relURL }}">Home</a>
  <span>/</span>
  <span>{{ .Title }}</span>
</nav>

<h1>{{ .Title }}</h1>
{{ with .Content }}<div class="section-content">{{ . }}</div>{{ end }}

<ul class="post-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="meta">{{ .Date.Format "Jan 2, 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
